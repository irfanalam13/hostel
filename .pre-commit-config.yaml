# Local pre-commit hooks (Phase 1, §9). Complements the CI gitleaks job in
# .github/workflows/security.yml by catching secrets BEFORE they ever leave a
# developer machine — the CI scan is the backstop, this is the first line.
#
# Install once per clone:
#   pip install pre-commit && pre-commit install
# Run against everything on demand:
#   pre-commit run --all-files
repos:
  # --- Secret detection (mirrors the CI gitleaks gate) ----------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Belt-and-braces secret/hygiene checks --------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  # --- Block committing a PLAINTEXT secret that should be SOPS-encrypted -----
  # Fails if a file under secrets/ that is meant to be encrypted isn't.
  - repo: https://github.com/yuvipanda/pre-commit-hook-ensure-sops
    rev: v1.1
    hooks:
      - id: sops-encryption
        files: ^secrets/.*\.(enc\.env|sops\.(ya?ml|json))$

  # --- Auth/account regression gate ------------------------------------------
  # Runs the accounts/tenants/security(+RBAC) test suite whenever a commit
  # touches auth-relevant code, so signup/login/password-reset/hostel-id-reset
  # regressions are caught locally before they ever reach CI. Uses the
  # project's existing fast SQLite settings (config.settings_test) — no
  # Docker/Postgres needed — so this stays a few seconds, not minutes. For the
  # slower, Postgres/Redis-backed run matching CI, use
  # `docker compose --profile test up test` instead (see docker-compose.yml).
  - repo: local
    hooks:
      - id: auth-tests
        name: Auth/account regression tests (pytest)
        # Falls back to a bare `python` if the contributor hasn't created
        # backend/.venv (it's gitignored, so this can't be assumed).
        entry: >-
          bash -c 'cd backend &&
          PY=.venv/bin/python; [ -x "$PY" ] || PY=python;
          "$PY" -m pytest apps/accounts apps/tenants apps/security
          apps/discovery/tests/test_consumer_auth.py apps/common/tests/test_rbac.py
          --no-cov -q -x'
        language: system
        pass_filenames: false
        files: ^backend/apps/(accounts|tenants|security)/|^backend/apps/discovery/tests/test_consumer_auth\.py$|^backend/apps/common/(rbac|permissions)\.py$|^backend/config/settings(_test)?\.py$
        stages: [pre-commit]
